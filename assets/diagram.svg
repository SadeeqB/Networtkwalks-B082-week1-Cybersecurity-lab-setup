<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111827">
    <rect x="20" y="40" width="180" height="80" rx="8" fill="#e6f2ff" stroke="#0366d6"/>
    <text x="110" y="70" text-anchor="middle" font-weight="700">Host (Windows)</text>
    <text x="110" y="92" text-anchor="middle">VirtualBox</text>

    <rect x="310" y="20" width="180" height="80" rx="8" fill="#fff7e6" stroke="#d97706"/>
    <text x="400" y="50" text-anchor="middle" font-weight="700">Kali VM</text>
    <text x="400" y="72" text-anchor="middle">10.0.0.2/24</text>

    <rect x="310" y="150" width="180" height="80" rx="8" fill="#fff7e6" stroke="#d97706"/>
    <text x="400" y="180" text-anchor="middle" font-weight="700">Target VM (future)</text>
    <text x="400" y="202" text-anchor="middle">10.0.0.3–0.99</text>

    <rect x="580" y="75" width="180" height="80" rx="8" fill="#e6ffe6" stroke="#059669"/>
    <text x="670" y="105" text-anchor="middle" font-weight="700">NAT Network</text>
    <text x="670" y="127" text-anchor="middle">10.0.0.0/24</text>
  </g>

  <line x1="200" y1="80" x2="310" y2="60" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="60" x2="580" y2="115" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="190" x2="580" y2="115" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#6b7280" />
    </marker>
  </defs>

  <text x="20" y="290" font-size="11" fill="#6b7280">Diagram: Host → VirtualBox → VMs connected to a NAT Network allowing internal communication + outbound NAT</text>
</svg>
